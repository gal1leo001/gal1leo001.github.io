<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ANZURA — Yörüngeden Cevhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #02050d; overflow: hidden; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #fff; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- animations.jsx -->
<script type="text/babel" data-presets="env,react">

// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook.
//
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44; // playback bar height
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard: space = play/pause, ← → = seek
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space */}
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      {/* Playback bar — stacked below canvas, never overlapping */}
      <PlaybackBar
        time={displayTime}
        actualTime={time}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 4,
          background: 'rgba(255,255,255,0.12)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 4,
          background: 'oklch(72% 0.12 250)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: 12, height: 12,
          marginLeft: -6, marginTop: -6,
          background: '#fff',
          borderRadius: 6,
          boxShadow: '0 2px 4px rgba(0,0,0,0.4)',
        }}/>
      </div>

      {/* Duration: fixed width */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer',
        padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}


Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});


</script>

<!-- scenes/topo-bg.jsx -->
<script type="text/babel" data-presets="env,react">
// Topographic background — subtle contour lines + grid + noise
// Always-on layer that lives behind every scene.

function TopoBackground() {
  const time = useTime();

  // Slow drift
  const drift = time * 4;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(ellipse at 50% 50%, #0a1628 0%, #050a18 55%, #02050d 100%)',
      overflow: 'hidden',
    }}>
      {/* Topographic contour lines (SVG, slowly drifting) */}
      <svg
        width="1920" height="1080" viewBox="0 0 1920 1080"
        style={{ position: 'absolute', inset: 0, opacity: 0.18 }}
      >
        <defs>
          <radialGradient id="topo-fade" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stopColor="#7aa6ff" stopOpacity="1"/>
            <stop offset="100%" stopColor="#7aa6ff" stopOpacity="0"/>
          </radialGradient>
          <mask id="topo-mask">
            <rect width="1920" height="1080" fill="url(#topo-fade)"/>
          </mask>
        </defs>
        <g mask="url(#topo-mask)" stroke="#5a8fd6" strokeWidth="0.8" fill="none" opacity="0.7">
          {Array.from({ length: 22 }).map((_, i) => {
            const seed = i * 137.5;
            const baseY = 60 + i * 48;
            const path = Array.from({ length: 60 }).map((_, j) => {
              const x = j * 32.2;
              const y = baseY
                + Math.sin((j * 0.18) + (seed * 0.01) + drift * 0.02) * (40 + i * 2)
                + Math.cos((j * 0.07) + (seed * 0.02)) * 20;
              return `${j === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
            }).join(' ');
            return <path key={i} d={path} opacity={0.25 + (i % 4) * 0.15}/>;
          })}
        </g>
      </svg>

      {/* Coordinate grid */}
      <svg
        width="1920" height="1080"
        style={{ position: 'absolute', inset: 0, opacity: 0.08 }}
      >
        <defs>
          <pattern id="grid-fine" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6da3e8" strokeWidth="0.5"/>
          </pattern>
          <pattern id="grid-coarse" width="200" height="200" patternUnits="userSpaceOnUse">
            <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#6da3e8" strokeWidth="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid-fine)"/>
        <rect width="1920" height="1080" fill="url(#grid-coarse)"/>
      </svg>

      {/* Vignette */}
      <div style={{
        position: 'absolute', inset: 0,
        background: 'radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.6) 100%)',
        pointerEvents: 'none',
      }}/>

      {/* Subtle noise grain */}
      <div style={{
        position: 'absolute', inset: 0,
        opacity: 0.04,
        backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=%270 0 200 200%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.9%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E")',
        mixBlendMode: 'overlay',
      }}/>
    </div>
  );
}

// Pulse: concentric expanding rings from a point
function SignalPulse({ x, y, color = '#5a8fd6', delay = 0, period = 3, max = 280, count = 3 }) {
  const time = useTime();
  return (
    <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }} width="1920" height="1080">
      {Array.from({ length: count }).map((_, i) => {
        const t = ((time - delay - i * (period / count)) % period) / period;
        if (t < 0 || t > 1) return null;
        const r = t * max;
        const op = (1 - t) * 0.5;
        return <circle key={i} cx={x} cy={y} r={r} fill="none" stroke={color} strokeWidth="1" opacity={op}/>;
      })}
      <circle cx={x} cy={y} r="3" fill={color} opacity="0.9"/>
    </svg>
  );
}

// Corner HUD bracket
function HUDBracket({ x, y, w = 60, h = 40, color = 'rgba(122, 166, 255, 0.45)' }) {
  return (
    <svg style={{ position: 'absolute', left: x, top: y, pointerEvents: 'none' }} width={w} height={h}>
      <path d={`M 0 ${h*0.4} L 0 0 L ${w*0.4} 0`} stroke={color} strokeWidth="1" fill="none"/>
      <path d={`M ${w} ${h*0.4} L ${w} 0 L ${w*0.6} 0`} stroke={color} strokeWidth="1" fill="none"/>
      <path d={`M 0 ${h*0.6} L 0 ${h} L ${w*0.4} ${h}`} stroke={color} strokeWidth="1" fill="none"/>
      <path d={`M ${w} ${h*0.6} L ${w} ${h} L ${w*0.6} ${h}`} stroke={color} strokeWidth="1" fill="none"/>
    </svg>
  );
}

// Persistent corner UI: timestamp, coordinate readouts, system labels
function FrameUI({ opacity = 1 }) {
  const time = useTime();
  const tick = Math.floor(time * 10);
  const lat = (39.9334 + Math.sin(time * 0.3) * 0.0004).toFixed(4);
  const lon = (32.8597 + Math.cos(time * 0.25) * 0.0004).toFixed(4);

  const mono = 'ui-monospace, "JetBrains Mono", "SF Mono", monospace';
  const labelStyle = {
    fontFamily: mono,
    fontSize: 11,
    letterSpacing: '0.18em',
    color: 'rgba(180, 210, 255, 0.55)',
    textTransform: 'uppercase',
    fontWeight: 500,
  };

  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity }}>
      {/* Top-left: system identifier */}
      <div style={{ position: 'absolute', left: 48, top: 80, ...labelStyle }}>
        <div style={{ color: 'rgba(220, 235, 255, 0.85)', fontWeight: 600 }}>ANZURA / SYS-01</div>
        <div style={{ marginTop: 4 }}>ORBITAL DECISION SUPPORT</div>
      </div>

      {/* Top-right: timestamp */}
      <div style={{ position: 'absolute', right: 48, top: 80, textAlign: 'right', ...labelStyle }}>
        <div style={{ color: 'rgba(220, 235, 255, 0.85)' }}>T+{String(tick).padStart(5, '0')}</div>
        <div style={{ marginTop: 4 }}>UTC · STREAM ACTIVE</div>
      </div>

      {/* Bottom-left: coordinates */}
      <div style={{ position: 'absolute', left: 48, bottom: 80, ...labelStyle }}>
        <div>LAT {lat}°N</div>
        <div style={{ marginTop: 4 }}>LON {lon}°E</div>
      </div>

      {/* Bottom-right: status */}
      <div style={{ position: 'absolute', right: 48, bottom: 80, textAlign: 'right', ...labelStyle }}>
        <div>SCAN · NOMINAL</div>
        <div style={{ marginTop: 4 }}>SIGNAL · 0.98</div>
      </div>

      {/* Corner brackets — also inside the safe zone */}
      <HUDBracket x={24} y={68}/>
      <HUDBracket x={1920 - 84} y={68}/>
      <HUDBracket x={24} y={1080 - 108}/>
      <HUDBracket x={1920 - 84} y={1080 - 108}/>
    </div>
  );
}

Object.assign(window, { TopoBackground, SignalPulse, HUDBracket, FrameUI });

</script>

<script type="text/babel" data-presets="env,react">
// Earth + orbiting satellite scene

// Earth: rendered as a soft sphere with continent outlines drawn from
// abstracted polygons (no real geography needed, just suggestive shapes).
function Earth({ cx = 960, cy = 540, r = 280, rotation = 0, scanY = null, scanIntensity = 1 }) {
  // Continent silhouettes — abstract, not geographic
  const continents = [
    'M -120 -80 Q -60 -110 0 -90 Q 50 -70 80 -100 Q 110 -120 130 -90 Q 150 -50 110 -30 Q 80 -10 60 -40 Q 20 -20 -40 -30 Q -100 -40 -120 -80 Z',
    'M -180 20 Q -140 0 -100 30 Q -70 60 -90 100 Q -120 130 -160 110 Q -200 80 -180 20 Z',
    'M 60 40 Q 110 30 150 60 Q 180 100 160 140 Q 130 170 90 160 Q 50 140 60 40 Z',
    'M -40 80 Q 0 70 20 100 Q 30 130 0 140 Q -30 130 -40 80 Z',
  ];

  return (
    <g transform={`translate(${cx} ${cy})`}>
      {/* Glow halo */}
      <circle r={r + 60} fill="url(#earth-halo)" opacity="0.5"/>
      <circle r={r + 18} fill="none" stroke="rgba(122, 166, 255, 0.25)" strokeWidth="1"/>

      {/* Earth sphere */}
      <circle r={r} fill="url(#earth-sphere)"/>

      {/* Latitude/longitude grid clipped to sphere */}
      <clipPath id="earth-clip">
        <circle r={r}/>
      </clipPath>
      <g clipPath="url(#earth-clip)" stroke="rgba(122, 166, 255, 0.22)" fill="none" strokeWidth="0.7">
        {/* longitudes */}
        {Array.from({ length: 12 }).map((_, i) => {
          const phase = (i / 12) * Math.PI * 2 + rotation;
          const rx = Math.abs(Math.cos(phase)) * r;
          if (rx < 1) return null;
          return <ellipse key={`lng${i}`} cx={0} cy={0} rx={rx} ry={r}/>;
        })}
        {/* latitudes */}
        {Array.from({ length: 9 }).map((_, i) => {
          const lat = (i - 4) * (r / 5);
          const ry = Math.sqrt(Math.max(0, r * r - lat * lat)) * 0.18;
          return <ellipse key={`lat${i}`} cx={0} cy={lat} rx={Math.sqrt(Math.max(0, r * r - lat * lat))} ry={ry}/>;
        })}
      </g>

      {/* Continent silhouettes — rotate as a group */}
      <g clipPath="url(#earth-clip)" transform={`rotate(${rotation * 30})`}>
        {continents.map((d, i) => (
          <path key={i} d={d} fill="rgba(90, 143, 214, 0.32)" stroke="rgba(150, 195, 255, 0.5)" strokeWidth="0.6"
                transform={`scale(${r / 200}) translate(${i * 5}, ${i * -8})`}/>
        ))}
      </g>

      {/* Scan line sweeping across the visible disk */}
      {scanY !== null && (
        <g clipPath="url(#earth-clip)">
          <line x1={-r} y1={scanY} x2={r} y2={scanY}
                stroke="#7ee0ff" strokeWidth="2" opacity={0.9 * scanIntensity}/>
          <rect x={-r} y={scanY - 40} width={r * 2} height={40}
                fill="url(#scan-fade)" opacity={0.6 * scanIntensity}/>
        </g>
      )}

      {/* Atmosphere rim */}
      <circle r={r} fill="none" stroke="rgba(150, 200, 255, 0.4)" strokeWidth="2" opacity="0.6"/>
      <circle r={r + 4} fill="none" stroke="rgba(120, 170, 230, 0.2)" strokeWidth="6" opacity="0.5"/>
    </g>
  );
}

// Satellite: small geometric body with two solar panels.
// Drawn at given angle/orbit radius around (cx, cy).
function Satellite({ cx, cy, orbitR, angle, beam = 0 }) {
  const x = cx + Math.cos(angle) * orbitR;
  const y = cy + Math.sin(angle) * orbitR * 0.55; // ellipse for perspective
  const tilt = (angle * 180) / Math.PI;

  // Beam target on Earth surface (toward center)
  const dx = cx - x, dy = cy - y;
  const len = Math.sqrt(dx * dx + dy * dy);
  const ux = dx / len, uy = dy / len;
  const earthR = 280;
  const tx = cx - ux * earthR;
  const ty = cy - uy * earthR;

  return (
    <g>
      {/* Beam */}
      {beam > 0 && (
        <g opacity={beam}>
          <defs>
            <linearGradient id={`beam-grad-${Math.round(angle * 100)}`}
                            x1={x} y1={y} x2={tx} y2={ty} gradientUnits="userSpaceOnUse">
              <stop offset="0%" stopColor="#7ee0ff" stopOpacity="0.95"/>
              <stop offset="100%" stopColor="#7ee0ff" stopOpacity="0"/>
            </linearGradient>
          </defs>
          <polygon points={`${x-2},${y} ${x+2},${y} ${tx+18},${ty} ${tx-18},${ty}`}
                   fill={`url(#beam-grad-${Math.round(angle * 100)})`}/>
          <line x1={x} y1={y} x2={tx} y2={ty} stroke="#7ee0ff" strokeWidth="0.8" opacity="0.6"/>
        </g>
      )}

      <g transform={`translate(${x} ${y}) rotate(${tilt + 90})`}>
        {/* Solar panels */}
        <rect x={-28} y={-3} width={20} height={6} fill="#1a2940" stroke="#5a8fd6" strokeWidth="0.5"/>
        <rect x={8} y={-3} width={20} height={6} fill="#1a2940" stroke="#5a8fd6" strokeWidth="0.5"/>
        <line x1={-28} y1={0} x2={-8} y2={0} stroke="#7aa6ff" strokeWidth="0.3" opacity="0.6"/>
        <line x1={8} y1={0} x2={28} y2={0} stroke="#7aa6ff" strokeWidth="0.3" opacity="0.6"/>
        {/* Body */}
        <rect x={-6} y={-5} width={12} height={10} fill="#243a5c" stroke="#a8c5f0" strokeWidth="0.6"/>
        <rect x={-3} y={-3} width={6} height={6} fill="#7ee0ff" opacity="0.7"/>
        {/* Antenna */}
        <line x1={0} y1={-5} x2={0} y2={-12} stroke="#a8c5f0" strokeWidth="0.5"/>
        <circle cx={0} cy={-13} r={1.2} fill="#7ee0ff"/>
      </g>

      {/* Tracking ring */}
      <circle cx={x} cy={y} r="14" fill="none" stroke="rgba(126, 224, 255, 0.4)" strokeWidth="0.6"/>
    </g>
  );
}

// Earth scene wrapper with all gradients defined
function EarthScene({ scale = 1, rotation = 0, satAngle, beam, scanProgress = null, opacity = 1, cx = 960, cy = 540 }) {
  const r = 280;
  const scanY = scanProgress !== null ? -r + scanProgress * r * 2 : null;
  const orbitR = r + 90;

  return (
    <svg
      width="1920" height="1080"
      style={{
        position: 'absolute', inset: 0,
        opacity,
        transformOrigin: `${cx}px ${cy}px`,
        transform: `scale(${scale})`,
      }}
    >
      <defs>
        <radialGradient id="earth-sphere" cx="35%" cy="35%" r="75%">
          <stop offset="0%" stopColor="#1e3a6b"/>
          <stop offset="40%" stopColor="#0f2447"/>
          <stop offset="80%" stopColor="#06122a"/>
          <stop offset="100%" stopColor="#020812"/>
        </radialGradient>
        <radialGradient id="earth-halo" cx="50%" cy="50%" r="50%">
          <stop offset="60%" stopColor="rgba(80, 130, 210, 0)"/>
          <stop offset="80%" stopColor="rgba(100, 150, 230, 0.18)"/>
          <stop offset="100%" stopColor="rgba(100, 150, 230, 0)"/>
        </radialGradient>
        <linearGradient id="scan-fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#7ee0ff" stopOpacity="0"/>
          <stop offset="100%" stopColor="#7ee0ff" stopOpacity="0.5"/>
        </linearGradient>
      </defs>

      {/* Orbit path */}
      <ellipse cx={cx} cy={cy} rx={orbitR} ry={orbitR * 0.55}
               fill="none" stroke="rgba(126, 224, 255, 0.18)" strokeWidth="0.8" strokeDasharray="3 4"/>

      <Earth cx={cx} cy={cy} r={r} rotation={rotation} scanY={scanY}/>

      {satAngle !== undefined && (
        <Satellite cx={cx} cy={cy} orbitR={orbitR} angle={satAngle} beam={beam}/>
      )}
    </svg>
  );
}

Object.assign(window, { Earth, Satellite, EarthScene });

</script>

<script type="text/babel" data-presets="env,react">
// Scene 3: Data beams transforming into layered maps + spectral overlays.
// Stacked isometric "tiles" representing data layers, with gridlines, contours,
// and chromatic spectral bands.

function DataLayers({ progress = 0, cx = 960, cy = 560 }) {
  // Layers stack vertically with parallax. progress 0..1 reveals each in turn.
  const layers = [
    { label: 'TOPOGRAPHY',     fill: 'rgba(20, 40, 80, 0.85)',  accent: '#7aa6ff', kind: 'topo' },
    { label: 'SPECTRAL · SWIR', fill: 'rgba(40, 25, 70, 0.85)', accent: '#c884ff', kind: 'spectral' },
    { label: 'GEOSPATIAL',     fill: 'rgba(15, 50, 70, 0.85)',  accent: '#7ee0ff', kind: 'geo' },
    { label: 'TARGET MODEL',   fill: 'rgba(60, 30, 25, 0.85)',  accent: '#ff9a6b', kind: 'target' },
  ];

  const layerW = 520;
  const layerH = 320;
  const skewX = -22;   // degrees (visual, via transform)
  const skewY = 12;
  const stepY = 70;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      pointerEvents: 'none',
    }}>
      <div style={{
        position: 'relative',
        width: layerW, height: layerH + stepY * (layers.length - 1),
        transform: 'perspective(1400px) rotateX(54deg) rotateZ(-32deg)',
        transformStyle: 'preserve-3d',
      }}>
        {layers.map((L, i) => {
          // each layer reveals at i*0.18 .. i*0.18 + 0.4
          const start = i * 0.16;
          const end = start + 0.45;
          const t = clamp((progress - start) / (end - start), 0, 1);
          const eased = Easing.easeOutCubic(t);
          const z = i * 90;
          const opacity = eased;
          const ty = (1 - eased) * -120;

          return (
            <div key={i} style={{
              position: 'absolute',
              left: 0, top: 0,
              width: layerW, height: layerH,
              transform: `translateZ(${z}px) translateY(${ty}px)`,
              opacity,
            }}>
              <DataLayerCard width={layerW} height={layerH} kind={L.kind} accent={L.accent} fill={L.fill} label={L.label} progress={t}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function DataLayerCard({ width, height, kind, accent, fill, label, progress }) {
  return (
    <div style={{
      width, height,
      background: fill,
      border: `1px solid ${accent}`,
      boxShadow: `0 0 60px ${accent}33, inset 0 0 80px rgba(255,255,255,0.04)`,
      position: 'relative',
      overflow: 'hidden',
    }}>
      <svg width={width} height={height} style={{ position: 'absolute', inset: 0 }}>
        {kind === 'topo' && <TopoLayerSVG w={width} h={height} accent={accent} progress={progress}/>}
        {kind === 'spectral' && <SpectralLayerSVG w={width} h={height} accent={accent} progress={progress}/>}
        {kind === 'geo' && <GeoLayerSVG w={width} h={height} accent={accent} progress={progress}/>}
        {kind === 'target' && <TargetLayerSVG w={width} h={height} accent={accent} progress={progress}/>}
      </svg>

      {/* Label badge — counter-rotate so it's readable */}
      <div style={{
        position: 'absolute',
        left: 14, top: 12,
        fontFamily: 'ui-monospace, "JetBrains Mono", monospace',
        fontSize: 11,
        letterSpacing: '0.22em',
        color: accent,
        textTransform: 'uppercase',
        opacity: 0.95,
        textShadow: `0 0 10px ${accent}`,
      }}>
        {label}
      </div>
    </div>
  );
}

function TopoLayerSVG({ w, h, accent, progress }) {
  return (
    <g stroke={accent} fill="none" strokeWidth="0.7" opacity={0.85}>
      {Array.from({ length: 14 }).map((_, i) => {
        const baseY = 30 + i * (h - 60) / 13;
        const points = Array.from({ length: 30 }).map((_, j) => {
          const x = j * (w / 29);
          const y = baseY + Math.sin(j * 0.4 + i * 0.7) * 12 + Math.cos(j * 0.18 + i * 1.3) * 8;
          return `${j === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
        }).join(' ');
        return <path key={i} d={points} opacity={0.4 + (i % 3) * 0.2}/>;
      })}
    </g>
  );
}

function SpectralLayerSVG({ w, h, accent, progress }) {
  // Horizontal spectral bands with gradient hues
  const bands = [
    { hue: 'rgba(255, 100, 80, 0.5)', y: 30 },
    { hue: 'rgba(255, 200, 100, 0.5)', y: 80 },
    { hue: 'rgba(160, 255, 140, 0.5)', y: 130 },
    { hue: 'rgba(120, 220, 255, 0.5)', y: 180 },
    { hue: 'rgba(180, 130, 255, 0.55)', y: 230 },
    { hue: 'rgba(255, 120, 200, 0.5)', y: 280 },
  ];
  return (
    <g>
      {bands.map((b, i) => (
        <g key={i}>
          <rect x={0} y={b.y} width={w * progress} height={28} fill={b.hue}/>
          {/* Spectral signature spikes */}
          {Array.from({ length: 50 }).map((_, j) => {
            const x = j * (w / 49);
            const sp = Math.sin(j * 0.4 + i * 1.7) * 10 + Math.cos(j * 1.1 + i * 0.3) * 5;
            return <line key={j} x1={x} y1={b.y + 14} x2={x} y2={b.y + 14 - sp}
                         stroke={accent} strokeWidth="0.5" opacity="0.6"/>;
          })}
        </g>
      ))}
    </g>
  );
}

function GeoLayerSVG({ w, h, accent, progress }) {
  // Map-like polygons + grid
  return (
    <g>
      <defs>
        <pattern id="geo-grid" width="32" height="32" patternUnits="userSpaceOnUse">
          <path d="M 32 0 L 0 0 0 32" fill="none" stroke={accent} strokeWidth="0.4" opacity="0.5"/>
        </pattern>
      </defs>
      <rect width={w} height={h} fill="url(#geo-grid)" opacity="0.6"/>
      {/* Region polygons */}
      <path d="M 60 60 L 180 50 L 240 90 L 220 150 L 140 170 L 70 130 Z"
            fill={accent} fillOpacity="0.18" stroke={accent} strokeWidth="1"/>
      <path d="M 260 80 L 380 70 L 440 130 L 400 200 L 300 210 L 250 150 Z"
            fill={accent} fillOpacity="0.12" stroke={accent} strokeWidth="1"/>
      <path d="M 80 200 L 200 220 L 230 280 L 150 290 L 70 260 Z"
            fill={accent} fillOpacity="0.22" stroke={accent} strokeWidth="1"/>
      <path d="M 320 240 L 440 240 L 470 290 L 360 300 Z"
            fill={accent} fillOpacity="0.15" stroke={accent} strokeWidth="1"/>
      {/* Sample points */}
      {[[120,100],[300,110],[180,240],[400,170],[150,260],[380,260]].map(([x,y],i) => (
        <g key={i}>
          <circle cx={x} cy={y} r="3" fill={accent}/>
          <circle cx={x} cy={y} r="8" fill="none" stroke={accent} strokeWidth="0.5" opacity="0.5"/>
        </g>
      ))}
    </g>
  );
}

function TargetLayerSVG({ w, h, accent, progress }) {
  // Heatmap-like blob clusters indicating ore probability
  return (
    <g>
      <defs>
        <radialGradient id="target-blob" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor={accent} stopOpacity="0.7"/>
          <stop offset="60%" stopColor={accent} stopOpacity="0.2"/>
          <stop offset="100%" stopColor={accent} stopOpacity="0"/>
        </radialGradient>
      </defs>
      {[
        [140, 110, 80], [380, 90, 60], [200, 230, 90],
        [400, 220, 70], [280, 160, 50],
      ].map(([x, y, r], i) => (
        <circle key={i} cx={x} cy={y} r={r * progress} fill="url(#target-blob)"/>
      ))}
      {/* Crosshair targets */}
      {[[140, 110], [380, 90], [200, 230]].map(([x, y], i) => (
        <g key={i} opacity={progress}>
          <circle cx={x} cy={y} r="14" fill="none" stroke={accent} strokeWidth="1"/>
          <line x1={x-20} y1={y} x2={x-8} y2={y} stroke={accent} strokeWidth="1"/>
          <line x1={x+8} y1={y} x2={x+20} y2={y} stroke={accent} strokeWidth="1"/>
          <line x1={x} y1={y-20} x2={x} y2={y-8} stroke={accent} strokeWidth="1"/>
          <line x1={x} y1={y+8} x2={x} y2={y+20} stroke={accent} strokeWidth="1"/>
          <circle cx={x} cy={y} r="2" fill={accent}/>
        </g>
      ))}
    </g>
  );
}

Object.assign(window, { DataLayers });

</script>

<script type="text/babel" data-presets="env,react">
// Scene 4: AI Core — central node with data streams flowing in from labeled
// satellites of analysis (geospatial / spectral / topographic / risk).

function AICore({ progress = 0, cx = 960, cy = 540 }) {
  // 6 input nodes orbit around a central core
  const inputs = [
    { label: 'GEOSPATIAL',   angle: -Math.PI/2, dist: 320 },
    { label: 'SPECTRAL',     angle: -Math.PI/6, dist: 320 },
    { label: 'TOPOGRAPHY',   angle: Math.PI/6,  dist: 320 },
    { label: 'AI MODEL',     angle: Math.PI/2,  dist: 320 },
    { label: 'RISK ANALYSIS', angle: 5*Math.PI/6, dist: 320 },
    { label: 'FEASIBILITY',  angle: 7*Math.PI/6, dist: 320 },
  ];

  const time = useTime();
  const corePulse = 1 + Math.sin(time * 2.5) * 0.03;

  return (
    <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
      <defs>
        <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#7ee0ff" stopOpacity="1"/>
          <stop offset="40%" stopColor="#5a8fd6" stopOpacity="0.6"/>
          <stop offset="100%" stopColor="#5a8fd6" stopOpacity="0"/>
        </radialGradient>
        <radialGradient id="core-inner" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#ffffff" stopOpacity="1"/>
          <stop offset="30%" stopColor="#7ee0ff" stopOpacity="0.95"/>
          <stop offset="100%" stopColor="#1d4a90" stopOpacity="0.9"/>
        </radialGradient>
        <linearGradient id="stream-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="rgba(126,224,255,0)"/>
          <stop offset="50%" stopColor="rgba(126,224,255,0.6)"/>
          <stop offset="100%" stopColor="rgba(126,224,255,1)"/>
        </linearGradient>
      </defs>

      {/* Outer rings (ambient) */}
      {[180, 240, 320, 410].map((r, i) => (
        <circle key={r} cx={cx} cy={cy} r={r * progress}
                fill="none"
                stroke="rgba(122, 166, 255, 0.18)"
                strokeWidth="0.7"
                strokeDasharray={i % 2 ? '2 6' : '4 8'}/>
      ))}

      {/* Rotating ring around core */}
      <g transform={`translate(${cx} ${cy}) rotate(${time * 25})`}>
        <circle r="100" fill="none" stroke="rgba(126, 224, 255, 0.35)" strokeWidth="1" strokeDasharray="2 14"/>
      </g>
      <g transform={`translate(${cx} ${cy}) rotate(${-time * 18})`}>
        <circle r="125" fill="none" stroke="rgba(122, 166, 255, 0.22)" strokeWidth="1" strokeDasharray="6 22"/>
      </g>

      {/* Streams flowing inward */}
      {inputs.map((node, i) => {
        const localStart = 0.1 + i * 0.06;
        const t = clamp((progress - localStart) / 0.5, 0, 1);
        if (t <= 0) return null;
        const x = cx + Math.cos(node.angle) * node.dist;
        const y = cy + Math.sin(node.angle) * node.dist;

        // Particle along the line
        const pulse = ((time + i * 0.3) % 1.5) / 1.5;
        const px = x + (cx - x) * pulse;
        const py = y + (cy - y) * pulse;

        return (
          <g key={node.label} opacity={t}>
            {/* Line */}
            <line x1={x} y1={y} x2={cx} y2={cy}
                  stroke="rgba(126, 224, 255, 0.35)" strokeWidth="0.8"/>
            {/* Glowing line segment */}
            <line x1={x + (cx - x) * 0.0} y1={y + (cy - y) * 0.0}
                  x2={x + (cx - x) * pulse} y2={y + (cy - y) * pulse}
                  stroke="#7ee0ff" strokeWidth="1.6" opacity="0.7"/>
            {/* Particle */}
            <circle cx={px} cy={py} r="3" fill="#7ee0ff" opacity="0.95"/>
            <circle cx={px} cy={py} r="6" fill="#7ee0ff" opacity="0.25"/>

            {/* Outer node */}
            <circle cx={x} cy={y} r="5" fill="#0a1628" stroke="#7aa6ff" strokeWidth="1"/>
            <circle cx={x} cy={y} r="14" fill="none" stroke="rgba(122, 166, 255, 0.4)" strokeWidth="0.6"/>

            {/* Label */}
            <NodeLabel x={x} y={y} angle={node.angle} label={node.label}/>
          </g>
        );
      })}

      {/* Core */}
      <g transform={`translate(${cx} ${cy})`}>
        <circle r={120 * corePulse} fill="url(#core-glow)" opacity={progress}/>
        <circle r={50 * corePulse * progress} fill="url(#core-inner)"/>

        {/* Hexagonal core ring */}
        <g opacity={progress}>
          <polygon
            points={hexPoints(0, 0, 32 * corePulse).join(' ')}
            fill="none" stroke="#ffffff" strokeWidth="1.4" opacity="0.85"
            transform={`rotate(${time * 40})`}/>
          <polygon
            points={hexPoints(0, 0, 22 * corePulse).join(' ')}
            fill="none" stroke="#ffffff" strokeWidth="1" opacity="0.7"
            transform={`rotate(${-time * 60})`}/>
          <circle r="6" fill="#ffffff"/>
        </g>
      </g>
    </svg>
  );
}

function NodeLabel({ x, y, angle, label }) {
  // Position label outside the node, away from center
  const offset = 26;
  const lx = x + Math.cos(angle) * offset;
  const ly = y + Math.sin(angle) * offset;
  // Anchor based on which side
  const anchor = Math.cos(angle) > 0.3 ? 'start'
                : Math.cos(angle) < -0.3 ? 'end' : 'middle';
  return (
    <text x={lx} y={ly + 4}
          textAnchor={anchor}
          fontFamily='ui-monospace, "JetBrains Mono", monospace'
          fontSize="11"
          letterSpacing="3"
          fill="rgba(200, 220, 255, 0.85)">
      {label}
    </text>
  );
}

function hexPoints(cx, cy, r) {
  return Array.from({ length: 6 }).map((_, i) => {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
    return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`;
  });
}

Object.assign(window, { AICore, hexPoints });

</script>

<script type="text/babel" data-presets="env,react">
// Scene 5: Outputs — target identification, risk analysis, digital feasibility.
// Three side-by-side analytical panels emerging from the AI core.

function OutputPanels({ progress = 0 }) {
  const panels = [
    {
      title: 'TARGET DETECTION',
      kind: 'target',
      sub: 'Cu-Au-Mo · CONFIDENCE 0.94',
      x: 240,
    },
    {
      title: 'RISK ANALYSIS',
      kind: 'risk',
      sub: 'GEOLOGICAL · ENVIRONMENTAL',
      x: 760,
    },
    {
      title: 'DIGITAL FEASIBILITY',
      kind: 'feasibility',
      sub: 'NPV · IRR · CAPEX MODEL',
      x: 1280,
    },
  ];

  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
      {panels.map((p, i) => {
        const start = i * 0.12;
        const t = clamp((progress - start) / 0.55, 0, 1);
        const eased = Easing.easeOutCubic(t);
        return (
          <div key={i} style={{
            position: 'absolute',
            left: p.x, top: 290,
            width: 400, height: 500,
            opacity: eased,
            transform: `translateY(${(1 - eased) * 40}px)`,
          }}>
            <OutputCard {...p} progress={t}/>
          </div>
        );
      })}
    </div>
  );
}

function OutputCard({ title, sub, kind, progress }) {
  return (
    <div style={{
      width: '100%', height: '100%',
      background: 'linear-gradient(180deg, rgba(15,30,55,0.78) 0%, rgba(8,18,38,0.88) 100%)',
      border: '1px solid rgba(122, 166, 255, 0.28)',
      backdropFilter: 'blur(6px)',
      boxShadow: '0 0 40px rgba(40, 80, 160, 0.25), inset 0 0 60px rgba(80,140,255,0.04)',
      padding: 24,
      position: 'relative',
      overflow: 'hidden',
      fontFamily: 'ui-monospace, "JetBrains Mono", monospace',
      color: '#dceaff',
    }}>
      {/* Corner brackets */}
      <CornerBrackets/>

      {/* Header */}
      <div style={{
        fontSize: 11,
        letterSpacing: '0.28em',
        color: 'rgba(160, 195, 245, 0.7)',
        marginBottom: 6,
      }}>
        OUTPUT MODULE · 0{kind === 'target' ? '1' : kind === 'risk' ? '2' : '3'}
      </div>
      <div style={{
        fontSize: 22,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontWeight: 600,
        letterSpacing: '0.04em',
        color: '#ffffff',
        marginBottom: 6,
      }}>
        {title}
      </div>
      <div style={{
        fontSize: 11,
        letterSpacing: '0.18em',
        color: 'rgba(126, 224, 255, 0.85)',
        marginBottom: 22,
      }}>
        {sub}
      </div>

      {/* Visualization */}
      <div style={{ position: 'relative', height: 240 }}>
        {kind === 'target' && <TargetViz progress={progress}/>}
        {kind === 'risk' && <RiskViz progress={progress}/>}
        {kind === 'feasibility' && <FeasibilityViz progress={progress}/>}
      </div>

      {/* Footer metrics */}
      <div style={{ marginTop: 22, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        {kind === 'target' && (
          <>
            <Metric label="ANOMALIES" value={Math.floor(7 * progress)}/>
            <Metric label="PRIORITY" value={progress > 0.6 ? 'HIGH' : '—'}/>
          </>
        )}
        {kind === 'risk' && (
          <>
            <Metric label="SCORE" value={(0.27 * progress).toFixed(2)}/>
            <Metric label="STATUS" value={progress > 0.5 ? 'LOW' : '—'}/>
          </>
        )}
        {kind === 'feasibility' && (
          <>
            <Metric label="NPV" value={progress > 0.6 ? '+$184M' : '—'}/>
            <Metric label="IRR" value={progress > 0.6 ? '21.4%' : '—'}/>
          </>
        )}
      </div>
    </div>
  );
}

function CornerBrackets() {
  const c = 'rgba(122, 166, 255, 0.6)';
  const sz = 12;
  const s = { position: 'absolute', width: sz, height: sz };
  return (
    <>
      <div style={{ ...s, left: 8, top: 8, borderLeft: `1px solid ${c}`, borderTop: `1px solid ${c}` }}/>
      <div style={{ ...s, right: 8, top: 8, borderRight: `1px solid ${c}`, borderTop: `1px solid ${c}` }}/>
      <div style={{ ...s, left: 8, bottom: 8, borderLeft: `1px solid ${c}`, borderBottom: `1px solid ${c}` }}/>
      <div style={{ ...s, right: 8, bottom: 8, borderRight: `1px solid ${c}`, borderBottom: `1px solid ${c}` }}/>
    </>
  );
}

function Metric({ label, value }) {
  return (
    <div>
      <div style={{ fontSize: 10, letterSpacing: '0.22em', color: 'rgba(160, 195, 245, 0.55)' }}>{label}</div>
      <div style={{
        fontSize: 18,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontWeight: 500,
        color: '#ffffff',
        marginTop: 2,
      }}>{value}</div>
    </div>
  );
}

// — Target viz: heatmap blobs + crosshairs over a small map
function TargetViz({ progress }) {
  const t = useTime();
  return (
    <svg viewBox="0 0 360 240" style={{ width: '100%', height: '100%' }}>
      <defs>
        <pattern id="tv-grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(122,166,255,0.18)" strokeWidth="0.4"/>
        </pattern>
        <radialGradient id="tv-blob" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#ff9a6b" stopOpacity="0.8"/>
          <stop offset="60%" stopColor="#ff9a6b" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#ff9a6b" stopOpacity="0"/>
        </radialGradient>
      </defs>
      <rect width="360" height="240" fill="rgba(10,22,40,0.4)"/>
      <rect width="360" height="240" fill="url(#tv-grid)"/>
      {/* Region polygon */}
      <path d="M 40 60 L 140 40 L 220 80 L 280 60 L 320 120 L 280 190 L 180 210 L 80 180 L 40 130 Z"
            fill="rgba(122,166,255,0.06)" stroke="rgba(122,166,255,0.5)" strokeWidth="0.8"/>
      {/* Heat blobs */}
      {[[110, 100, 50], [240, 130, 40], [180, 80, 30]].map(([x, y, r], i) => (
        <circle key={i} cx={x} cy={y} r={r * progress} fill="url(#tv-blob)"/>
      ))}
      {/* Crosshairs */}
      {[[110, 100], [240, 130], [180, 80]].map(([x, y], i) => (
        <g key={i} opacity={Math.max(0, progress - 0.35) / 0.65}>
          <circle cx={x} cy={y} r={10 + Math.sin(t * 2 + i) * 1.5}
                  fill="none" stroke="#ff9a6b" strokeWidth="1"/>
          <line x1={x-16} y1={y} x2={x-12} y2={y} stroke="#ff9a6b" strokeWidth="1"/>
          <line x1={x+12} y1={y} x2={x+16} y2={y} stroke="#ff9a6b" strokeWidth="1"/>
          <line x1={x} y1={y-16} x2={x} y2={y-12} stroke="#ff9a6b" strokeWidth="1"/>
          <line x1={x} y1={y+12} x2={x} y2={y+16} stroke="#ff9a6b" strokeWidth="1"/>
          <circle cx={x} cy={y} r="1.5" fill="#ff9a6b"/>
        </g>
      ))}
    </svg>
  );
}

// — Risk viz: radial chart with risk axes
function RiskViz({ progress }) {
  const axes = ['GEO', 'ENV', 'OPS', 'REG', 'INFRA', 'SOCIAL'];
  const values = [0.28, 0.22, 0.31, 0.18, 0.34, 0.21]; // low risk
  const cx = 180, cy = 120, R = 92;

  const points = axes.map((_, i) => {
    const a = (i / axes.length) * Math.PI * 2 - Math.PI / 2;
    const r = values[i] * R * progress + (R - values[i] * R) * 0; // value*R from center
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    return `${px.toFixed(1)},${py.toFixed(1)}`;
  }).join(' ');

  return (
    <svg viewBox="0 0 360 240" style={{ width: '100%', height: '100%' }}>
      <rect width="360" height="240" fill="rgba(10,22,40,0.4)"/>
      {/* Concentric rings */}
      {[0.25, 0.5, 0.75, 1].map((s, i) => (
        <circle key={i} cx={cx} cy={cy} r={R * s}
                fill="none" stroke="rgba(122,166,255,0.18)" strokeWidth="0.5"/>
      ))}
      {/* Axes + labels */}
      {axes.map((ax, i) => {
        const a = (i / axes.length) * Math.PI * 2 - Math.PI / 2;
        const ex = cx + Math.cos(a) * R;
        const ey = cy + Math.sin(a) * R;
        const lx = cx + Math.cos(a) * (R + 16);
        const ly = cy + Math.sin(a) * (R + 16);
        return (
          <g key={i}>
            <line x1={cx} y1={cy} x2={ex} y2={ey} stroke="rgba(122,166,255,0.25)" strokeWidth="0.5"/>
            <text x={lx} y={ly + 3} textAnchor="middle"
                  fontSize="9" letterSpacing="2"
                  fill="rgba(160,195,245,0.7)"
                  fontFamily='ui-monospace, monospace'>{ax}</text>
          </g>
        );
      })}
      {/* Filled polygon */}
      <polygon points={points}
               fill="rgba(126, 224, 255, 0.22)"
               stroke="#7ee0ff"
               strokeWidth="1.2"/>
      {axes.map((_, i) => {
        const a = (i / axes.length) * Math.PI * 2 - Math.PI / 2;
        const r = values[i] * R * progress;
        return <circle key={i} cx={cx + Math.cos(a) * r} cy={cy + Math.sin(a) * r}
                       r="2.5" fill="#7ee0ff"/>;
      })}
    </svg>
  );
}

// — Feasibility viz: cashflow bars + IRR curve
function FeasibilityViz({ progress }) {
  const years = 8;
  const cashflows = [-65, -40, 18, 42, 58, 71, 64, 52]; // $M
  const maxV = 85;
  const w = 360, h = 240;
  const left = 30, right = 20, top = 24, bottom = 36;
  const plotW = w - left - right;
  const plotH = h - top - bottom;
  const zeroY = top + plotH * 0.5;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: '100%' }}>
      <rect width={w} height={h} fill="rgba(10,22,40,0.4)"/>
      {/* Zero axis */}
      <line x1={left} y1={zeroY} x2={w - right} y2={zeroY}
            stroke="rgba(122,166,255,0.4)" strokeWidth="0.6"/>
      {/* Bars */}
      {cashflows.map((cf, i) => {
        const barT = clamp(progress * years - i, 0, 1);
        const barW = plotW / years - 8;
        const x = left + i * (plotW / years) + 4;
        const ratio = (cf / maxV) * (plotH * 0.5) * barT;
        const y = ratio < 0 ? zeroY : zeroY - ratio;
        const height = Math.abs(ratio);
        const positive = cf >= 0;
        return (
          <rect key={i} x={x} y={y} width={barW} height={height}
                fill={positive ? '#7ee0ff' : '#ff7a7a'}
                opacity={0.85}/>
        );
      })}
      {/* Cumulative line */}
      <CumulativeLine cashflows={cashflows} maxV={maxV} progress={progress}
                       left={left} top={top} plotW={plotW} plotH={plotH} zeroY={zeroY} years={years}/>
      {/* X labels */}
      {Array.from({ length: years }).map((_, i) => (
        <text key={i} x={left + i * (plotW / years) + (plotW / years) / 2}
              y={h - 14} textAnchor="middle"
              fontSize="9" fill="rgba(160,195,245,0.55)"
              fontFamily='ui-monospace, monospace'>Y{i + 1}</text>
      ))}
    </svg>
  );
}

function CumulativeLine({ cashflows, maxV, progress, left, top, plotW, plotH, zeroY, years }) {
  let cum = 0;
  const cumMax = 200;
  const points = cashflows.map((cf, i) => {
    cum += cf;
    const x = left + i * (plotW / years) + (plotW / years) / 2;
    const y = zeroY - (cum / cumMax) * (plotH * 0.5);
    return [x, y];
  });
  const visible = clamp(progress * 1.1, 0, 1);
  const visibleCount = Math.floor(visible * years);
  const path = points.slice(0, visibleCount + 1).map(([x, y], i) => `${i === 0 ? 'M' : 'L'} ${x} ${y}`).join(' ');
  return (
    <g>
      <path d={path} fill="none" stroke="#a8c5f0" strokeWidth="1.4"/>
      {points.slice(0, visibleCount + 1).map(([x, y], i) => (
        <circle key={i} cx={x} cy={y} r="2" fill="#ffffff"/>
      ))}
    </g>
  );
}

Object.assign(window, { OutputPanels });

</script>

                      size={48} weight={300} letterSpacing="0.42em"
                      color="rgba(220, 235, 255, 0.92)"/>
        <div style={{

          height: 1,
          background: 'linear-gradient(90deg, transparent, rgba(126,224,255,0.85), transparent)',

      <div style={{
        marginTop: 32,

        opacity: clamp((progress - 0.55) * 3, 0, 1),
      }}>
        Satellite-Based Digital Decision Support System
      </div>

      {/* Footer marks */}
      <div style={{
        position: 'absolute',
        bottom: 100,
        display: 'flex', gap: 56,
        fontFamily: 'ui-monospace, "JetBrains Mono", monospace',
        fontSize: 10,
        letterSpacing: '0.32em',
        color: 'rgba(160, 195, 245, 0.55)',
        opacity: clamp((progress - 0.7) * 4, 0, 1),
      }}>
        <span>FROM ORBIT</span>
        <span style={{ color: 'rgba(126, 224, 255, 0.7)' }}>—</span>
        <span>TO ORE</span>
      </div>

      {/* KOSGEB attribution */}
      <div style={{
        position: 'absolute',
        bottom: 56,
        fontFamily: 'ui-monospace, "JetBrains Mono", monospace',
        fontSize: 10,
        letterSpacing: '0.32em',
        color: 'rgba(160, 195, 245, 0.4)',
        opacity: clamp((progress - 0.75) * 4, 0, 1),

        DEVELOPED WITH KOSGEB · DEEP-TECH MINING INTELLIGENCE
      </div>

}

function KineticTitle({ text, progress, size, weight, letterSpacing, color = '#ffffff', mainWord = false }) {
  const letters = text.split('');
  return (
    <div style={{
      display: 'flex',
      fontSize: size,
      fontWeight: weight,
      letterSpacing,
      color,
      lineHeight: 1,
      whiteSpace: 'pre',
    }}>
      {letters.map((ch, i) => {
        const start = i * 0.04;
        const end = start + 0.18;
        const t = clamp((progress - start) / (end - start), 0, 1);
        const eased = Easing.easeOutCubic(t);
        const op = eased;
        const blur = (1 - eased) * (mainWord ? 18 : 8);
        const ty = (1 - eased) * (mainWord ? 28 : 14);

        return (
          <span key={i} style={{
            display: 'inline-block',
            opacity: op,
            transform: `translateY(${ty}px)`,
            filter: `blur(${blur}px)`,
            textShadow: mainWord && eased > 0.6
              ? '0 0 30px rgba(126, 224, 255, 0.35)'
              : 'none',
            willChange: 'transform, opacity, filter',
          }}>
            {ch}
          </span>
        );
      })}
    </div>
  );
}

Object.assign(window, { TitleReveal, KineticTitle });

</script>

<!-- scenes/composition.jsx -->
<script type="text/babel" data-presets="env,react">
// Main composition: orchestrates all scenes on a single timeline.

const SCENE_TIMES = {
  // Total duration: 22s
  s1_topo:    [0.0, 4.0],   // topographic background + signal pulses
  s2_satellite: [3.0, 9.0],  // satellite scanning earth (overlap with s1)
  s3_layers:  [8.0, 13.5],  // data beams transform into map layers
  s4_core:    [12.5, 17.5], // streams converge into AI core
  s5_outputs: [16.5, 20.5], // outputs expand: target / risk / feasibility
  s6_title:   [19.5, 22.0], // title reveal
};

// Animate a value through life of [start, end, fadeIn, fadeOut]
function lifeProgress(time, [start, end], fadeIn = 0.6, fadeOut = 0.6) {
  if (time < start || time > end) return { active: false, opacity: 0, progress: 0 };
  const local = time - start;
  const total = end - start;
  let opacity = 1;
  if (local < fadeIn) opacity = local / fadeIn;
  else if (local > total - fadeOut) opacity = (total - local) / fadeOut;
  return {
    active: true,
    opacity: clamp(opacity, 0, 1),
    progress: clamp(local / total, 0, 1),
  };
}

function ANZURAIntro() {
  const time = useTime();

  // ── Scene 1: topo + pulses ──────────────────────────────────────────────
  const s1 = lifeProgress(time, SCENE_TIMES.s1_topo, 0.5, 1.0);

  // ── Scene 2: satellite ──────────────────────────────────────────────────
  const s2 = lifeProgress(time, SCENE_TIMES.s2_satellite, 0.8, 0.8);
  // Satellite orbit angle
  const satOrbitT = (time - SCENE_TIMES.s2_satellite[0]);
  const satAngle = -Math.PI * 0.85 + satOrbitT * 0.55;
  // Earth zoom in s1->s2 (small to medium) and lifts toward center
  const earthScale = interpolate(
    [0, SCENE_TIMES.s1_topo[1] - 1, SCENE_TIMES.s2_satellite[1], SCENE_TIMES.s3_layers[0] + 0.5],
    [0.2, 0.9, 1.0, 1.4],
    Easing.easeInOutCubic
  )(time);
  const earthRotation = (time - SCENE_TIMES.s1_topo[0]) * 0.18;
  const earthOpacity = clamp(
    interpolate([0, 1.5, SCENE_TIMES.s3_layers[0], SCENE_TIMES.s3_layers[0] + 1.5],
                [0, 1, 1, 0],
                Easing.easeInOutCubic)(time), 0, 1);
  // Beam fades in mid-scene-2
  const beam = clamp((time - (SCENE_TIMES.s2_satellite[0] + 1.0)) / 1.0, 0, 1)
              * (1 - clamp((time - (SCENE_TIMES.s3_layers[0] - 0.3)) / 0.8, 0, 1));
  // Scan line during scene 2
  const scanProgress = (() => {
    const start = SCENE_TIMES.s2_satellite[0] + 1.5;
    const end = SCENE_TIMES.s2_satellite[1] - 0.4;
    if (time < start || time > end) return null;
    return (time - start) / (end - start);
  })();

  // ── Scene 3: data layers ────────────────────────────────────────────────
  const s3 = lifeProgress(time, SCENE_TIMES.s3_layers, 0.7, 1.0);

  // ── Scene 4: AI core ────────────────────────────────────────────────────
  const s4 = lifeProgress(time, SCENE_TIMES.s4_core, 0.7, 0.8);

  // ── Scene 5: outputs ────────────────────────────────────────────────────
  const s5 = lifeProgress(time, SCENE_TIMES.s5_outputs, 0.6, 0.8);

  // ── Scene 6: title ──────────────────────────────────────────────────────
  const s6 = lifeProgress(time, SCENE_TIMES.s6_title, 0.4, 0.0);

  // Frame UI fades during title
  const frameUIOpacity = clamp(
    interpolate([0, 0.8, SCENE_TIMES.s6_title[0] - 0.5, SCENE_TIMES.s6_title[0] + 0.6],
                [0, 1, 1, 0])(time), 0, 1);

  return (
    <>
      {/* Always-on topographic background */}
      <TopoBackground/>

      {/* Scene 1: signal pulses on topo */}
      {s1.active && (
        <div style={{ opacity: s1.opacity }}>
          <SignalPulse x={420} y={680} delay={0} period={3.2} max={240}/>
          <SignalPulse x={1480} y={420} delay={0.7} period={3.0} max={220}/>
          <SignalPulse x={1100} y={840} delay={1.4} period={3.4} max={260}/>
          <SignalPulse x={300} y={300} delay={2.1} period={2.8} max={200}/>
        </div>
      )}

      {/* Scene 2: Earth + Satellite (continues into s3 as a fading background) */}
      {earthOpacity > 0.01 && (
        <EarthScene
          scale={earthScale}
          rotation={earthRotation}
          satAngle={s2.active ? satAngle : undefined}
          beam={beam}
          scanProgress={scanProgress}
          opacity={earthOpacity}
        />
      )}

      {/* Scene 3: data layers */}
      {s3.active && (
        <div style={{ opacity: s3.opacity }}>
          <DataLayers progress={s3.progress}/>
        </div>
      )}

      {/* Scene 4: AI core */}
      {s4.active && (
        <div style={{ opacity: s4.opacity }}>
          <AICore progress={s4.progress}/>
        </div>
      )}

      {/* Scene 5: outputs */}
      {s5.active && (
        <div style={{ opacity: s5.opacity }}>
          <OutputPanels progress={s5.progress}/>
        </div>
      )}

      {/* Scene 6: title reveal — full bleed cover */}
      {s6.active && (
        <div style={{
          position: 'absolute', inset: 0,
          background: `radial-gradient(ellipse at 50% 50%, rgba(5,12,28,${s6.opacity * 0.7}) 0%, rgba(2,5,15,${s6.opacity * 0.95}) 100%)`,
          opacity: 1,
        }}>
          <TitleReveal progress={s6.progress}/>
        </div>
      )}

      {/* Letterbox bars (rendered first, FrameUI sits above) */}
      <div style={{
        position: 'absolute', left: 0, right: 0, top: 0,
        height: 60, background: '#000', pointerEvents: 'none', zIndex: 5,
      }}/>
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0,
        height: 60, background: '#000', pointerEvents: 'none', zIndex: 5,
      }}/>

      {/* Persistent frame UI — above letterbox */}
      <div style={{ position: 'absolute', inset: 0, zIndex: 6, pointerEvents: 'none' }}>
        <FrameUI opacity={frameUIOpacity}/>
      </div>

      {/* Scene captions */}
      <div style={{ position: 'absolute', inset: 0, zIndex: 6, pointerEvents: 'none' }}>
        <PhaseCaption time={time}/>
      </div>
    </>
  );
}

function PhaseCaption({ time }) {
  const captions = [
    { range: [0.5, 3.5], text: 'PHASE 01 · SIGNAL ACQUISITION' },
    { range: [3.8, 8.0], text: 'PHASE 02 · ORBITAL OBSERVATION' },
    { range: [8.5, 12.5], text: 'PHASE 03 · GEOSPATIAL × SPECTRAL FUSION' },
    { range: [13.0, 16.5], text: 'PHASE 04 · AI MODELING CORE' },
    { range: [17.0, 19.5], text: 'PHASE 05 · DECISION OUTPUTS' },
  ];
  const active = captions.find(c => time >= c.range[0] && time <= c.range[1]);
  if (!active) return null;
  const local = time - active.range[0];
  const total = active.range[1] - active.range[0];
  const op = local < 0.5 ? local / 0.5 : local > total - 0.5 ? (total - local) / 0.5 : 1;

  return (
    <div style={{
      position: 'absolute',
      bottom: 88, left: '50%',
      transform: 'translateX(-50%)',
      fontFamily: 'ui-monospace, "JetBrains Mono", monospace',
      fontSize: 12,
      letterSpacing: '0.5em',
      color: 'rgba(126, 224, 255, 0.85)',
      opacity: clamp(op, 0, 1),
      whiteSpace: 'nowrap',
    }}>
      {active.text}
    </div>
  );
}

Object.assign(window, { ANZURAIntro });

</script>

<script type="text/babel" data-presets="env,react">
  function App() {
    return (
      <Stage width={1920} height={1080} duration={22} background="#02050d" persistKey="anzura-intro" autoplay={!window.location.hash.includes('pause')}>
        <ANZURAIntro/>
      </Stage>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
