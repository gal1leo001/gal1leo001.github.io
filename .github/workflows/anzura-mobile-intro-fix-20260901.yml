name: ANZURA mobile intro fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.codex-trigger/mobile-intro-fix-20260901.txt'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix mobile intro scaling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles-v2.css')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\r\n', '\n')
          changed = 0

          def swap(old, new, label):
              global text, changed
              if old in text:
                  text = text.replace(old, new, 1)
                  changed += 1
                  print(f'applied: {label}')
                  return
              if new in text:
                  print(f'already applied: {label}')
                  return
              raise SystemExit(f'could not find CSS block: {label}')

          swap('''body.v2 {
  background: var(--paper);
  --site-chrome-height: 118px;
}''', ''':root {
  --site-chrome-height: 118px;
}

body.v2 {
  background: var(--paper);
}''', 'root chrome height')

          swap('''@media (max-width: 768px) {
  .hero-v2 {
    min-height: calc(100svh - var(--site-chrome-height));
    height: calc(100svh - var(--site-chrome-height));
  }
  .hero-v2-title .l2,
  .hero-v2-title .l3 { padding-left: 0; }
  .hero-rail, .hero-rail--bottom { gap: 16px; }
  .rail-item { padding-left: 12px; }
  .rail-item--right { padding-right: 12px; }
  .quote-v2 blockquote::before { display: none; }
}''', '''@media (max-width: 768px) {
  .hero-v2 {
    min-height: 0;
    height: auto;
    background: #f1ede4;
  }
  .hero-v2 .hero-media--intro {
    position: relative;
    inset: auto;
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
  }
  .hero-v2-shell--minimal {
    position: relative;
    inset: auto;
    display: flex;
    justify-content: flex-end;
    min-height: 0;
    padding: 20px var(--gutter) 28px;
  }
  .hero-v2-actions--corner {
    position: relative;
    right: auto;
    bottom: auto;
    align-items: flex-end;
  }
  .hero-v2-title .l2,
  .hero-v2-title .l3 { padding-left: 0; }
  .hero-rail, .hero-rail--bottom { gap: 16px; }
  .rail-item { padding-left: 12px; }
  .rail-item--right { padding-right: 12px; }
  .quote-v2 blockquote::before { display: none; }
}''', 'mobile hero flow')

          swap('''  body.v2 {
    --site-chrome-height: 96px;
    min-width: 0;
    overflow-x: hidden;
  }''', '''  body.v2 {
    min-width: 0;
    overflow-x: hidden;
  }''', 'mobile chrome height override')

          swap('''  body.v2 .hero-v2 {
    min-height: calc(100svh - var(--site-chrome-height));
    height: calc(100svh - var(--site-chrome-height));
    background:
      linear-gradient(180deg, rgba(14, 23, 20, 0.22), rgba(14, 23, 20, 0.76)),
      url("assets/hero-mining.jpg") center / cover no-repeat #12201b;
  }''', '''  body.v2 .hero-v2 {
    min-height: 0;
    height: auto;
    background: #f1ede4;
  }''', 'mobile hardening hero size')

          swap('''  body.v2 .hero-v2 .hero-media--intro {
    --mobile-intro-height: 100%;
    top: 0;
    bottom: auto;
    height: var(--mobile-intro-height);
  }''', '''  body.v2 .hero-v2 .hero-media--intro {
    position: relative;
    inset: auto;
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
  }''', 'mobile intro iframe ratio')

          swap('''  body.v2 .hero-v2:has(.hero-v2-shell--minimal) .hero-v2-overlay,
  body.v2 .hero-v2:has(.hero-v2-shell--minimal) .hero-v2-grid {
    display: block;
  }''', '''  body.v2 .hero-v2:has(.hero-v2-shell--minimal) .hero-v2-overlay,
  body.v2 .hero-v2:has(.hero-v2-shell--minimal) .hero-v2-grid {
    display: none;
  }''', 'mobile overlay fallback')

          swap('''  body.v2 .hero-v2-shell--minimal::before,
  body.v2 .hero-v2-shell--minimal::after {
    position: absolute;
    left: 18px;
    right: 18px;
    color: #fff;
    text-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
  }''', '''  body.v2 .hero-v2-shell--minimal {
    position: relative;
    inset: auto;
    display: flex;
    justify-content: flex-end;
    min-height: 0;
    padding: 20px var(--gutter) 28px;
  }''', 'mobile shell flow')

          swap('''  body.v2 .hero-v2-shell--minimal::before {
    content: "ANZURA";
    top: 30%;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(56px, 16vw, 78px);
    font-weight: 700;
    letter-spacing: 0;
    line-height: 0.92;
  }''', '''  body.v2 .hero-v2-shell--minimal::before {
    content: none;
  }''', 'mobile ANZURA fallback text')

          swap('''  body.v2 .hero-v2-shell--minimal::after {
    content: "MADENCILIK VE MUHENDISLIK A.S.";
    top: calc(30% + 76px);
    max-width: 280px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.45;
  }''', '''  body.v2 .hero-v2-shell--minimal::after {
    content: none;
  }''', 'mobile subtitle fallback text')

          swap('''  body.v2 .hero-v2-actions--corner {
    left: 18px;
    right: 18px;
    bottom: 18px;
    flex-direction: column;
    align-items: stretch;
  }''', '''  body.v2 .hero-v2-actions--corner {
    position: relative;
    left: auto;
    right: auto;
    bottom: auto;
    margin-left: auto;
    flex-direction: column;
    align-items: flex-end;
  }''', 'mobile actions flow')

          swap('''  body.v2 .hero-v2-actions--corner .btn {
    width: 100%;
    min-height: 48px;
    justify-content: center;
    text-align: center;
    white-space: normal;
  }''', '''  body.v2 .hero-v2-actions--corner .btn {
    width: max-content;
    min-height: 48px;
    justify-content: center;
    text-align: center;
    white-space: normal;
  }''', 'mobile action button width')

          forbidden = [
              '--site-chrome-height: 96px',
              'content: "ANZURA"',
              'content: "MADENCILIK VE MUHENDISLIK A.S."',
              'url("assets/hero-mining.jpg") center / cover no-repeat #12201b',
          ]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit('mobile fallback leftovers: ' + ', '.join(leftovers))
          if 'aspect-ratio: 16 / 9;' not in text:
              raise SystemExit('intro aspect ratio rule missing')

          path.write_text(text, encoding='utf-8')
          print(f'changed blocks: {changed}')
          PY

      - name: Commit mobile intro fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles-v2.css
          git commit -m "Fix mobile intro scaling"
          git push
