name: Apply mobile frame top

on:
  push:
    paths:
      - .github/workflows/mobile-frame-top.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile intro frame top
        shell: python
        run: |
          from pathlib import Path
          import re

          def write_if_changed(path, text):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              if old != text:
                  p.write_text(text, encoding='utf-8', newline='')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = re.sub(r'styles-v2\.css\?v=20260514-mobile-intro(?:-[a-z0-9]+)?', 'styles-v2.css?v=20260514-mobile-intro-frame-top', s)
          s = re.sub(r'assets/intro2/index\.html\?hero=1&v=20260514-mobile-intro(?:-[a-z0-9]+)?', 'assets/intro2/index.html?hero=1&v=20260514-mobile-intro-frame-top', s)
          inline_rule = '\n'.join([
              '    body.v2 .hero-v2 .hero-media--intro {',
              '      display: block !important;',
              '      --mobile-intro-height: 100%;',
              '      top: 0 !important;',
              '      bottom: auto !important;',
              '      height: var(--mobile-intro-height) !important;',
              '      object-fit: fill !important;',
              '      object-position: center top !important;',
              '    }',
          ])
          s = re.sub(
              r'    body\.v2 \.hero-v2 \.hero-media--intro \{\s*display: block !important;.*?object-position: center top !important;\s*\}',
              inline_rule,
              s,
              flags=re.S,
          )
          write_if_changed(index, s)

          css = Path('styles-v2.css')
          s = css.read_text(encoding='utf-8')
          css_rule = '\n'.join([
              '  body.v2 .hero-v2 .hero-media--intro {',
              '    --mobile-intro-height: 100%;',
              '    top: 0;',
              '    bottom: auto;',
              '    height: var(--mobile-intro-height);',
              '  }',
          ])
          if '--mobile-intro-' in s:
              s = re.sub(r'  body\.v2 \.hero-v2 \.hero-media--intro \{\s*--mobile-intro-.*?\n  \}', css_rule, s, count=1, flags=re.S)
          else:
              s = re.sub(r'  body\.v2 \.hero-v2 \.hero-media--intro \{\s*display: none;\s*\}', css_rule, s, count=1)
          write_if_changed(css, s)

          intro_app = Path('assets/intro2/intro-app.jsx')
          s = intro_app.read_text(encoding='utf-8')
          s = s.replace("fit={heroMode ? 'cover' : 'contain'}", "fit={heroMode && !portraitHero ? 'cover' : 'contain'}")
          s = s.replace("frameY={portraitHero ? 'start' : 'center'}", "frameY={heroMode ? 'start' : 'center'}")
          write_if_changed(intro_app, s)

          for path in ['assets/intro2/animations.jsx', 'assets/intro2/index.html']:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  "transformOrigin: 'center',\n            flexShrink: 0,",
                  "transformOrigin: frameY === 'start' ? 'top center' : 'center',\n            flexShrink: 0,",
              )
              s = s.replace("fit={heroMode ? 'cover' : 'contain'}", "fit={heroMode && !portraitHero ? 'cover' : 'contain'}")
              s = s.replace('frameY="center"', "frameY={heroMode ? 'start' : 'center'}")
              s = s.replace("frameY={portraitHero ? 'start' : 'center'}", "frameY={heroMode ? 'start' : 'center'}")
              write_if_changed(p, s)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles-v2.css assets/intro2/intro-app.jsx assets/intro2/animations.jsx assets/intro2/index.html
          git rm .github/workflows/mobile-frame-top.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Align mobile intro frame without zoom"
            git push
          fi
