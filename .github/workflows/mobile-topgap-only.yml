name: Apply mobile topgap only

on:
  push:
    paths:
      - .github/workflows/mobile-topgap-only.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile intro top gap only
        shell: python
        run: |
          from pathlib import Path
          import re

          def write_if_changed(path, text):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              if old != text:
                  p.write_text(text, encoding='utf-8', newline='')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = re.sub(r'styles-v2\.css\?v=20260514-mobile-intro(?:-lift)?', 'styles-v2.css?v=20260514-mobile-intro-topgap', s)
          s = re.sub(r'assets/intro2/index\.html\?hero=1&v=20260514-mobile-intro(?:-lift)?', 'assets/intro2/index.html?hero=1&v=20260514-mobile-intro-topgap', s)
          hero_rule = '\n'.join([
              '    body.v2 .hero-v2 .hero-media--intro {',
              '      display: block !important;',
              '      --mobile-intro-lift: clamp(390px, 48svh, 430px);',
              '      top: calc(var(--mobile-intro-lift) * -1) !important;',
              '      bottom: auto !important;',
              '      height: calc(100% + var(--mobile-intro-lift)) !important;',
              '      object-fit: fill !important;',
              '      object-position: center top !important;',
              '    }',
          ])
          s = re.sub(
              r'    body\.v2 \.hero-v2 \.hero-media--intro \{\s*display: block !important;.*?object-position: center top !important;\s*\}',
              hero_rule,
              s,
              flags=re.S,
          )
          write_if_changed(index, s)

          css = Path('styles-v2.css')
          s = css.read_text(encoding='utf-8')
          css_rule = '\n'.join([
              '  body.v2 .hero-v2 .hero-media--intro {',
              '    --mobile-intro-lift: clamp(390px, 48svh, 430px);',
              '    top: calc(var(--mobile-intro-lift) * -1);',
              '    bottom: auto;',
              '    height: calc(100% + var(--mobile-intro-lift));',
              '  }',
          ])
          if '--mobile-intro-lift' not in s:
              s = re.sub(r'  body\.v2 \.hero-v2 \.hero-media--intro \{\s*display: none;\s*\}', css_rule, s)
          else:
              s = re.sub(r'  body\.v2 \.hero-v2 \.hero-media--intro \{.*?\n  \}', css_rule, s, count=1, flags=re.S)
          write_if_changed(css, s)

          for path in ['assets/intro2/intro-app.jsx', 'assets/intro2/index.html']:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = s.replace("fit={heroMode ? 'cover' : 'contain'}", "fit={heroMode && !portraitHero ? 'cover' : 'contain'}")
              s = s.replace('frameY="center"', "frameY={portraitHero ? 'start' : 'center'}")
              write_if_changed(p, s)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles-v2.css assets/intro2/intro-app.jsx assets/intro2/index.html
          git rm .github/workflows/mobile-topgap-only.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Keep mobile intro scale and close top gap"
            git push
          fi
