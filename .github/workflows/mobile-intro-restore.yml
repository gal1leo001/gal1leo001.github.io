name: Restore mobile intro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile intro behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          VERSION = '20260514-mobile-intro'
          override = '''  <style data-mobile-intro-restore>
            @media (max-width: 768px), (max-device-width: 768px) {
              body.v2 .hero-v2 { background: transparent !important; }
              body.v2 .hero-v2 .hero-media--intro {
                display: block !important;
                object-fit: fill !important;
                object-position: center top !important;
              }
              body.v2 .hero-v2-shell--minimal::before,
              body.v2 .hero-v2-shell--minimal::after {
                content: none !important;
                display: none !important;
              }
            }
          </style>
          '''

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('href="styles-v2.css"', f'href="styles-v2.css?v={VERSION}"')
          s = s.replace('src="assets/intro2/index.html?hero=1"', f'src="assets/intro2/index.html?hero=1&v={VERSION}"')
          if 'data-mobile-intro-restore' not in s:
              s = s.replace('</head>', override + '</head>')
          index.write_text(s, encoding='utf-8')

          def patch_stage(path: str) -> None:
              p = Path(path)
              if not p.exists():
                  return
              t = p.read_text(encoding='utf-8')
              t = t.replace("  fit = 'contain',\n  shadow = true,", "  fit = 'contain',\n  frameY = 'center',\n  initialTime = 0,\n  shadow = true,")
              old_init = """  const [time, setTime] = React.useState(() => {
              try {
                const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
                return isFinite(v) ? clamp(v, 0, duration) : 0;
              } catch { return 0; }
            });"""
              new_init = """  const [time, setTime] = React.useState(() => {
              try {
                const stored = localStorage.getItem(persistKey + ':t');
                if (stored != null) {
                  const v = parseFloat(stored);
                  return isFinite(v) ? clamp(v, 0, duration) : clamp(initialTime, 0, duration);
                }
                return clamp(initialTime, 0, duration);
              } catch { return clamp(initialTime, 0, duration); }
            });"""
              t = t.replace(old_init, new_init)
              t = t.replace("display: 'flex', alignItems: 'center', justifyContent: 'center',", "display: 'flex', alignItems: frameY === 'start' ? 'flex-start' : 'center', justifyContent: 'center',")
              p.write_text(t, encoding='utf-8')

          def patch_app(path: str) -> None:
              p = Path(path)
              if not p.exists():
                  return
              t = p.read_text(encoding='utf-8')
              marker = "  const heroMode = params.get('hero') === '1' || params.get('mode') === 'hero' || window.location.href.includes('hero=1');"
              if 'const portraitHero =' not in t:
                  t = t.replace(marker, marker + "\n  const portraitHero = heroMode && (window.innerWidth <= 768 || window.innerHeight > window.innerWidth);")
              t = t.replace('fit="contain"', "fit={heroMode && !portraitHero ? 'cover' : 'contain'}\n      frameY={portraitHero ? 'start' : 'center'}\n      initialTime={heroMode ? 0.8 : 0}")
              t = t.replace("fit={heroMode ? 'cover' : 'contain'}", "fit={heroMode && !portraitHero ? 'cover' : 'contain'}\n      frameY={portraitHero ? 'start' : 'center'}\n      initialTime={heroMode ? 0.8 : 0}")
              t = t.replace("persistKey={heroMode ? 'anzura-intro-hero' : 'anzura-intro-modal'}", "persistKey={heroMode ? 'anzura-intro-hero-20260514' : 'anzura-intro-modal'}")
              p.write_text(t, encoding='utf-8')

          patch_stage('assets/intro2/index.html')
          patch_stage('assets/intro2/animations.jsx')
          patch_app('assets/intro2/index.html')
          patch_app('assets/intro2/intro-app.jsx')

          wf = Path('.github/workflows/mobile-intro-restore.yml')
          if wf.exists():
              wf.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/intro2/index.html assets/intro2/animations.jsx assets/intro2/intro-app.jsx .github/workflows/mobile-intro-restore.yml
          if ! git diff --cached --quiet; then
            git commit -m "Restore mobile intro animation"
            git push
          fi
