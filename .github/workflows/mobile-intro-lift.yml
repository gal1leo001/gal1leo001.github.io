name: Apply mobile intro lift

on:
  push:
    paths:
      - .github/workflows/mobile-intro-lift.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile intro crop
        shell: python
        run: |
          from pathlib import Path

          def write_if_changed(path, text):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              if old != text:
                  p.write_text(text, encoding='utf-8', newline='')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('styles-v2.css?v=20260514-mobile-intro', 'styles-v2.css?v=20260514-mobile-intro-lift')
          s = s.replace('assets/intro2/index.html?hero=1&v=20260514-mobile-intro', 'assets/intro2/index.html?hero=1&v=20260514-mobile-intro-lift')
          old_inline = """      body.v2 .hero-v2 .hero-media--intro {
        display: block !important;
        object-fit: fill !important;
        object-position: center top !important;
      }
"""
          new_inline = """      body.v2 .hero-v2 .hero-media--intro {
        display: block !important;
        --mobile-intro-lift: clamp(220px, 34svh, 320px);
        top: calc(var(--mobile-intro-lift) * -1) !important;
        bottom: auto !important;
        height: calc(100% + var(--mobile-intro-lift)) !important;
        object-fit: fill !important;
        object-position: center top !important;
      }
"""
          if '--mobile-intro-lift' not in s:
              s = s.replace(old_inline, new_inline)
          write_if_changed(index, s)

          css = Path('styles-v2.css')
          s = css.read_text(encoding='utf-8')
          old_mobile_hero = """  body.v2 .hero-v2 {
    min-height: calc(100svh - var(--site-chrome-height));
    height: calc(100svh - var(--site-chrome-height));
    background: transparent;
  }
"""
          new_mobile_hero = old_mobile_hero + """
  body.v2 .hero-v2 .hero-media--intro {
    --mobile-intro-lift: clamp(220px, 34svh, 320px);
    top: calc(var(--mobile-intro-lift) * -1);
    bottom: auto;
    height: calc(100% + var(--mobile-intro-lift));
  }
"""
          if '--mobile-intro-lift' not in s:
              s = s.replace(old_mobile_hero, new_mobile_hero)
          write_if_changed(css, s)

          for path in ['assets/intro2/intro-app.jsx', 'assets/intro2/index.html']:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = s.replace("fit={heroMode && !portraitHero ? 'cover' : 'contain'}", "fit={heroMode ? 'cover' : 'contain'}")
              s = s.replace("frameY={portraitHero ? 'start' : 'center'}", 'frameY="center"')
              write_if_changed(p, s)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles-v2.css assets/intro2/intro-app.jsx assets/intro2/index.html
          git rm .github/workflows/mobile-intro-lift.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix mobile intro crop"
            git push
          fi
